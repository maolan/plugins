[package]
name = "maolan-plugins"
version = "0.0.3"
edition = "2024"
description = "Audio plugins for the Maolan ecosystem"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/plugins"
homepage = "https://maolan.rs"
keywords = ["audio", "plugin", "clap"]
categories = ["multimedia::audio"]

[lib]
crate-type = ["cdylib", "rlib"]

[patch.crates-io]
clap-clap = { git = "https://github.com/mekanix/clap-clap", branch = "feature/file-reference" }

[dependencies]
clap-clap = "0.5.0"
libc = "0.2"
base64 = "0.22.1"
dirs = "6"
oxideav-core = "0.1.32"
oxideav-basic = "0.0.9"
oxideav-flac = "0.0.11"
oxideav-mp3 = "0.1.3"
oxideav-ogg = "0.1.8"
symphonia = { version = "0.5.4", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
maolan-baseview = "0.0.3"
maolan-widgets = "0.0.21"
parking_lot = "0.12.3"
quick-xml = { version = "0.40.1", features = ["serialize"] }
rand = "0.10"
raw-window-handle = "0.5"
rayon = "1.10"
rustfft = "6.2"
wide = "1.4.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.18"
ureq = { version = "3", features = ["json"] }
urlencoding = "2.1.3"
tracing = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
iced_aw = "0.14.1"
iced_fonts = "0.3.0"
libloading = "0.8"
