[package]
name = "maolan-plugins"
version = "0.0.5"
edition = "2024"
description = "Audio plugins for the Maolan ecosystem"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/plugins"
homepage = "https://maolan.rs"
keywords = ["audio", "plugin", "clap"]
categories = ["multimedia::audio"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 3
debug = true

[dependencies]
maolan-clap = "0.5.1"
libc = "0.2"
base64 = "0.23.1"
dirs = "7.0.0"
oxideav-core = "0.1.35"
oxideav-basic = "0.0.10"
oxideav-flac = "0.0.11"
oxideav-mp3 = "0.1.3"
oxideav-ogg = "0.1.8"
pitch-detection = "0.3.0"
symphonia = { version = "0.6.1", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
maolan-baseview = { version = "0.0.6", features = ["canvas"] }
maolan-editor = { version = "0.0.7", default-features = false }
maolan-widgets = "0.0.37"
parking_lot = "0.12.5"
portable-atomic = { version = "1.14.0", features = ["float"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.2"
raw-window-handle = "0.6"
rayon = "1.12.0"
rustfft = "6.4.1"
wide = "1.6.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
libloading = "0.9.0"
