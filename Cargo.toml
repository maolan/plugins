[package]
name = "maolan-plugins"
version = "0.0.3"
edition = "2024"
description = "Audio plugins for the Maolan ecosystem"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/plugins"
homepage = "https://maolan.rs"
keywords = ["audio", "plugin", "clap"]
categories = ["multimedia::audio"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap-clap = "0.5.0"
libc = "0.2"
base64 = "0.22.1"
dirs = "6"
hound = "3.5.1"
ffmpeg-next = "8"
maolan-baseview = "0.0.3"
maolan-widgets = "0.0.21"
parking_lot = "0.12.3"
quick-xml = { version = "0.40.1", features = ["serialize"] }
rand = "0.10"
raw-window-handle = "0.5"
rayon = "1.10"
rustfft = "6.2"
wide = "1.4.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.18"
ureq = { version = "3", features = ["json"] }
urlencoding = "2.1.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
iced_aw = "0.14.1"
iced_fonts = "0.3.0"
