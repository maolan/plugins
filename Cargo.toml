[package]
name = "maolan-plugins"
version = "0.0.3"
edition = "2024"
description = "Audio plugins for the Maolan ecosystem"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/plugins"
homepage = "https://maolan.rs"
keywords = ["audio", "plugin", "clap"]
categories = ["multimedia::audio"]

[lib]
crate-type = ["cdylib", "rlib"]

[patch.crates-io]
clap-clap = { git = "https://github.com/mekanix/clap-clap", branch = "feature/file-reference" }

[dependencies]
clap-clap = "0.5.0"
libc = "0.2"
base64 = "0.23.1"
dirs = "6"
oxideav-core = "0.1.34"
oxideav-basic = "0.0.9"
oxideav-flac = "0.0.11"
oxideav-mp3 = "0.1.3"
oxideav-ogg = "0.1.8"
symphonia = { version = "0.5.4", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
maolan-baseview = "0.0.5"
maolan-widgets = "0.0.32"
parking_lot = "0.12.5"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rand = "0.10.2"
raw-window-handle = "0.6"
rayon = "1.12.0"
rustfft = "6.4.1"
wide = "1.6.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
iced_aw = "0.14.1"
iced_fonts = "0.3.0"
libloading = "0.9.0"
