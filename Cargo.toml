[package]
name = "maolan-plugins"
version = "0.1.3"
edition = "2024"
description = "Audio plugins for the Maolan ecosystem"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/plugins"
homepage = "https://maolan.rs"
keywords = ["audio", "plugin", "clap"]
categories = ["multimedia::audio"]

[profile.dev]
opt-level = 3
debug = true

[dependencies]
maolan-clap = "0.5.1"
libc = "0.2"
base64 = "0.23.1"
dirs = "7.0.0"
oxideav-core = "0.1.42"
oxideav-basic = "0.0.11"
oxideav-flac = "0.0.12"
oxideav-mp3 = "0.1.3"
oxideav-ogg = "0.1.9"
pitch-detection = "0.3.0"
symphonia = { version = "0.6.1", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
maolan-baseview = { version = "0.1.1", features = ["canvas"] }
maolan-editor = { version = "0.1.3", default-features = false }
maolan-widgets = "0.1.3"
parking_lot = "0.13.0"
portable-atomic = { version = "1.15.0", features = ["float"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.3"
raw-window-handle = "0.6"
rayon = "1.12.0"
rustfft = "6.4.1"
fearless_simd = "1.2"
fearless_simd_macros = "0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["json"] }
urlencoding = "2.1.3"
tracing = "0.1.44"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
libloading = "0.9.0"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.deb]
name = "maolan-plugins"
maintainer = "Maolan Team <studio@maolan.rs>"
section = "sound"
priority = "optional"
copyright = "2026, Maolan Team <studio@maolan.rs>"
depends = "libx11-6, libxcb1, libxkbcommon0, libxkbcommon-x11-0"
assets = [
  ["target/release/libmaolan_plugins.so", "usr/lib/clap/Maolan.clap", "755"],
  ["README.md", "usr/share/doc/maolan-plugins/", "644"],
  ["LICENSE", "usr/share/doc/maolan-plugins/", "644"],
]

[package.metadata.generate-rpm.requires]
libX11 = "*"
libxcb = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"

[package.metadata.generate-rpm]
name = "maolan-plugins"
summary = "Maolan CLAP audio plugins"
license = "BSD-2-Clause"
url = "https://github.com/maolan/plugins"
assets = [
  { source = "target/release/libmaolan_plugins.so", dest = "/usr/lib/clap/Maolan.clap", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/maolan-plugins/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/maolan-plugins/LICENSE", mode = "644" },
]
